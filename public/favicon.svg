<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" opacity="0.12"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#bgGrad)" stroke-width="4" opacity="0.5"/>

  <!-- Monogram -->
  <text x="256" y="300"
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
        font-weight="800"
        font-size="220"
        fill="url(#bgGrad)"
